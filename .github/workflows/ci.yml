name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # DSP core + unit tests + batch CLI (no JUCE) on all three platforms.
  core:
    name: core (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc,   cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++ }
          - { os: windows-2022, compiler: msvc,  cc: cl,    cxx: cl }
          - { os: macos-14,     compiler: apple-clang, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DFLUB_BUILD_TESTS=ON -DFLUB_BUILD_TOOLS=ON
          -DFLUB_WARNINGS_AS_ERRORS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      # docs/11 E52: golden renders of every factory preset (1/3-octave bands
      # and integrated LUFS within 0.05 dB of tests/golden/factory-presets.json).
      # Float results differ slightly between compilers, so they are compared
      # on this one reference leg only (about 3 s); uuid, contentHash and the
      # parameter defaults are checked by the unit tests on every leg.
      - name: Golden preset renders (reference platform)
        if: matrix.compiler == 'gcc'
        env:
          FLUB_GOLDEN_REFERENCE: "1"
        run: ./build/tests/flub_tests "Golden renders"
      - name: CLI smoke test
        shell: bash
        run: |
          ./build/tools/flubsound-cli/flubsound-cli params > /dev/null
          ./build/tools/flubsound-cli/flubsound-cli presets
      # The by-ear demo pack (`flubsound-cli demo`, docs/04 §10): a
      # loudness-matched before / after WAV pair per macro, Boost step and
      # module switch, with index.txt; 8 s programmes, 16-bit (about 70 MB,
      # a few seconds to render).
      - name: Demo pack (Linux)
        if: matrix.compiler == 'gcc'
        run: ./build/tools/flubsound-cli/flubsound-cli demo --out Flubsound-demo-pack --seconds 8 --format pcm16 --quiet
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'gcc'
        with:
          name: Flubsound-demo-pack
          path: Flubsound-demo-pack
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Address + UndefinedBehavior sanitizers over the full test suite.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # X11 headers (compile-time only; libX11 is loaded at run time) and an
      # X server + XTest for the Linux global-hotkey test.
      - name: X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst6 xvfb dbus libdbus-1-3
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DFLUB_SANITIZE=ON -DFLUB_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
      - name: Platform tests under Xvfb (X11 global hotkeys, ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: xvfb-run -a ./build/tests/flub_tests "Platform:"

  # ---------------------------------------------------------------------------
  # Clang RealtimeSanitizer over the full test suite. In this build the audio
  # entry points (ProcessingChain::process, MixEngine::process and every
  # Processor::process override) are [[clang::nonblocking]], so anything they
  # reach that allocates, frees, locks or blocks aborts the run.
  # tests/test_rtsan.cpp checks that the annotations are in place and that
  # the sanitizer really stops a violation.
  rtsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 + RTSan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Configure
        env:
          CC: clang-20
          CXX: clang++-20
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFLUB_RTSAN=ON -DFLUB_WARNINGS_AS_ERRORS=ON -DFLUB_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests (RTSan)
        env:
          RTSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # libFuzzer smoke (docs/11 E53): the four tests/fuzz targets (JSON parser,
  # preset load + migration, saved strip / plug-in state and device profiles,
  # ParametricEQ text import) under ASan + UBSan, 30 s each in parallel,
  # seeded from tests/fuzz/corpus (with the reproducers of earlier finds),
  # the factory presets and the device-profile database. Any crash,
  # sanitizer report or failed round-trip check fails the job and uploads the
  # input. The 1 h per target run is nightly (.github/workflows/nightly.yml).
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 + libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Configure
        env:
          CC: clang-20
          CXX: clang++-20
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLUB_WARNINGS_AS_ERRORS=ON
          -DFLUB_BUILD_FUZZERS=ON -DFLUB_BUILD_TESTS=OFF -DFLUB_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --parallel --target fuzz_json fuzz_preset fuzz_state fuzz_eqtext
      - name: Fuzz (30 s per target)
        run: tests/fuzz/run-fuzzers.sh build 30 fuzz-work
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: |
            fuzz-work/*-crash-*
            fuzz-work/*.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Desktop app + plug-in (JUCE) on all three platforms.
  app:
    name: app + plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libgl1-mesa-dev libpipewire-0.3-dev ninja-build xvfb
      # The cache key follows FLUB_JUCE_VERSION in cmake/FlubJuce.cmake, so a
      # JUCE bump there invalidates the cached checkout / build.
      - name: JUCE version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*set[[:space:]]*\([[:space:]]*FLUB_JUCE_VERSION[[:space:]]+"([^"]+)".*/\1/p' cmake/FlubJuce.cmake | head -n 1)
          if [ -z "$version" ]; then
            echo "::error file=cmake/FlubJuce.cmake::FLUB_JUCE_VERSION not found"
            exit 1
          fi
          echo "FLUB_JUCE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ env.FLUB_JUCE_VERSION }}-${{ runner.os }}
      # Windows: the static C++ runtime (/MT), so the app, its installer and
      # the VST3 run on a PC without the Visual C++ Redistributable.
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFLUB_BUILD_APP=ON -DFLUB_BUILD_PLUGIN=ON -DFLUB_BUILD_APP_TESTS=ON -DFLUB_BUILD_TESTS=OFF -DFLUB_BUILD_TOOLS=OFF
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' || '' }}
      - name: Build
        run: cmake --build build --parallel
      # tests/app (flub_app_tests): device callback real-time safety, headset
      # ceiling cap, analyser / meter data paths, per-app routing model. No
      # audio device and no display needed (the Ninja build is single-config,
      # so ctest finds the binary on every OS; it is the only registered test
      # here because FLUB_BUILD_TESTS is OFF).
      - name: App tests
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Headless screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          APP=$(find build -type f -name "Flubsound Pro" -perm -u+x | head -n 1)
          xvfb-run -a "$APP" --screenshot screenshot-music.png --mode music --size 1440x900
          xvfb-run -a "$APP" --screenshot screenshot-gaming.png --mode gaming --size 1440x900
          xvfb-run -a "$APP" --screenshot screenshot-headset.png --mode gaming --size 1440x900 --device "Headphones (Stealth 700 Gen 2 MAX)"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: screenshot-*.png
      # Inno Setup for the Windows installer (docs/11 E54); the runner image
      # may already have it.
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
      # An unsigned test package per OS: the app, the plug-in formats and
      # TESTING.txt (tools/scripts/package-desktop.sh); on Windows also the
      # installer FlubsoundPro-Setup-<version>.exe, on macOS a .dmg beside the
      # .zip, on Linux a menu entry and install.sh in the .tar.gz.
      - name: Package test build
        shell: bash
        env:
          FLUB_REQUIRE_INSTALLER: "1"
        run: |
          case "${{ runner.os }}" in
            Windows) label=windows ;;
            macOS) label=macos ;;
            *) label=linux ;;
          esac
          echo "FLUB_PACKAGE=Flubsound-$label" >> "$GITHUB_ENV"
          bash tools/scripts/package-desktop.sh build dist "$label"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLUB_PACKAGE }}
          path: dist/
          retention-days: 30
      # docs/11 E53 step 3: pluginval (Tracktion's plug-in validator, latest
      # release) loads the Flubsound FX VST3 and runs its tests at strictness
      # 5 in process: bus layouts, state save / restore, parameters,
      # automation, processing at several rates and block sizes, the editor
      # (Linux under Xvfb). Any failed test fails the job; it runs after the
      # package upload, so the test build is kept either way.
      - name: pluginval (VST3, strictness 5)
        shell: bash
        timeout-minutes: 20
        run: |
          case "${{ runner.os }}" in
            Windows) asset=pluginval_Windows.zip; exe=pluginval.exe ;;
            macOS) asset=pluginval_macOS.zip; exe=pluginval.app/Contents/MacOS/pluginval ;;
            *) asset=pluginval_Linux.zip; exe=pluginval ;;
          esac
          mkdir -p pluginval-bin pluginval-logs
          curl -fsSL --retry 3 -o pluginval-bin/pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$asset"
          unzip -q -o pluginval-bin/pluginval.zip -d pluginval-bin
          [ "${{ runner.os }}" = Windows ] || chmod +x "pluginval-bin/$exe"
          vst3="$PWD/build/plugin/FlubsoundFX_artefacts/Release/VST3/Flubsound FX.vst3"
          logs="$PWD/pluginval-logs"
          if [ "${{ runner.os }}" = Windows ]; then vst3=$(cygpath -w "$vst3"); logs=$(cygpath -w "$logs"); fi
          run=("pluginval-bin/$exe" --strictness-level 5 --validate-in-process --timeout-ms 120000 --output-dir "$logs" --validate "$vst3")
          if [ "${{ runner.os }}" = Linux ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pluginval-${{ runner.os }}
          path: pluginval-logs/
          retention-days: 30
