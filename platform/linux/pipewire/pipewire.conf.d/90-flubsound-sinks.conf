# Flubsound Pro - persistent per-strip virtual outputs for PipeWire.
#
# Install:  cp 90-flubsound-sinks.conf ~/.config/pipewire/pipewire.conf.d/
#           systemctl --user restart pipewire pipewire-pulse wireplumber
# Remove:   delete the file and restart the same services.
#
# Same sinks as flubsound-pipewire-setup.sh, but created by the PipeWire
# daemon itself at every start (the script's pactl modules vanish when
# pipewire-pulse restarts). Use one method, not both.
#
# monitor.channel-volumes = true makes each sink's ".monitor" (what Flubsound
# processes) follow the volume slider of the sink in the desktop mixer.

context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "flubsound_game"
            node.description        = "Flubsound Game"
            media.class             = Audio/Sink
            audio.position          = [ FL FR FC LFE RL RR SL SR ]
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "flubsound_music"
            node.description        = "Flubsound Music"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "flubsound_chat"
            node.description        = "Flubsound Chat"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "flubsound_system"
            node.description        = "Flubsound System"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]
