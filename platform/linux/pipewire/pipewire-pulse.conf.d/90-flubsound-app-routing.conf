# Flubsound Pro - example per-application routing rules (PipeWire + WirePlumber).
#
# How it works: WirePlumber's linking policy connects a new playback stream
# to the node named by the stream's "target.object" property (falling back to
# the default sink when that node does not exist). The rules below set
# target.object per application when the stream is created, so the game
# starts on "Flubsound Game" without any manual move. Because the property is
# set on the stream itself, this works with WirePlumber 0.4 (Lua config) and
# 0.5 (SPA-JSON config) alike.
#
# Install for PulseAudio-API applications (most games incl. Proton/Wine, SDL,
# browsers, Spotify, Discord):
#     cp 90-flubsound-app-routing.conf ~/.config/pipewire/pipewire-pulse.conf.d/
#     systemctl --user restart pipewire-pulse
# For native PipeWire applications copy the same file to
#     ~/.config/pipewire/client.conf.d/   (read by every pw_stream client at start)
#
# Notes
#   - You usually do not need this file: routing an app once (pavucontrol or
#     Flubsound's app list) is remembered by WirePlumber's restore-stream
#     logic. The rules pre-seed routes before an app has ever played.
#   - Match keys come from the client/stream properties; inspect them with
#       pactl list sink-inputs      (look at application.process.binary)
#     All keys inside one { } must match; several { } in "matches" are OR'ed.
#     A value starting with "~" is a regular expression.
#   - Validate on each distribution's PipeWire version: stream.rules is
#     documented in pipewire-pulse.conf(5) / pipewire-client.conf(5) of
#     PipeWire 1.x.
#   - target.object names the sinks created by flubsound-pipewire-setup.sh or
#     90-flubsound-sinks.conf.

stream.rules = [
    {   # Games: Steam titles, Proton/Wine games, the Steam client itself.
        matches = [
            { application.process.binary = "cs2" }
            { application.process.binary = "~.*\\.exe$" }             # Proton / Wine (exe name) ...
            { application.process.binary = "~wine(64)?-preloader" }  # ... or the Wine loader
            { application.process.binary = "steam" }
        ]
        actions = {
            update-props = {
                target.object = "flubsound_game"
            }
        }
    }
    {   # Music players.
        matches = [
            { application.process.binary = "spotify" }
            { application.name = "~[Rr]hythmbox.*" }
        ]
        actions = {
            update-props = {
                target.object = "flubsound_music"
            }
        }
    }
    {   # Voice chat.
        matches = [
            { application.process.binary = "~[Dd]iscord.*" }
            { application.process.binary = "teamspeak3" }
            { application.name = "Mumble" }
        ]
        actions = {
            update-props = {
                target.object = "flubsound_chat"
            }
        }
    }
]
